<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>AI VIDEO STUDIO</title>
<style>
:root{--bg:#07060d;--s1:#100e1c;--s2:#171429;--line:#2a2545;--tx:#f1eefc;--mu:#9a94b8;--p:#8b5cf6;--b:#3b82f6;--ok:#34d399;--wa:#fbbf24;--g:linear-gradient(135deg,#8b5cf6,#3b82f6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2a1a5e55,transparent),radial-gradient(700px 400px at -10% 20%,#12307055,transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;box-shadow:0 0 22px #8b5cf666}
.logo svg{width:18px;height:18px}
.tag{font-size:11px;color:var(--mu);border:1px solid var(--line);padding:4px 10px;border-radius:99px;display:flex;gap:6px;align-items:center;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px var(--wa)}
.tag.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2 small{text-transform:none;letter-spacing:0;font-weight:500}
textarea{width:100%;min-height:150px;resize:vertical;background:#0b0916;color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:16px;outline:0;transition:.25s}
textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #8b5cf630}
.row{display:grid;gap:8px}.c3{grid-template-columns:repeat(3,1fr)}
.chip{background:#0b0916;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 6px;font:inherit;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.25s;min-height:62px}
.chip small{font-weight:500;color:var(--mu);font-size:11px}
.chip:active{transform:scale(.96)}
.chip[aria-checked=true]{border-color:var(--p);background:linear-gradient(135deg,#8b5cf622,#3b82f622);box-shadow:0 0 18px #8b5cf633}
.ar{border:2px solid currentColor;border-radius:3px;display:block;opacity:.9}
.label{margin-top:16px}
.models{display:grid;gap:8px}
.model{display:flex;gap:12px;align-items:center;text-align:left;background:#0b0916;border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px;font:inherit;cursor:pointer;transition:.25s;width:100%}
.model[aria-checked=true]{border-color:var(--b);background:linear-gradient(135deg,#8b5cf61c,#3b82f61c)}
.model .ic{width:38px;height:38px;border-radius:11px;background:var(--g);display:grid;place-items:center;flex:none}
.model .ic svg{width:19px;height:19px}
.model b{display:block;font-size:14px}.model span{font-size:12px;color:var(--mu)}
.badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.btn{width:100%;border:0;border-radius:16px;padding:17px;font:inherit;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--g);cursor:pointer;display:flex;gap:10px;justify-content:center;align-items:center;box-shadow:0 8px 28px #6d4df066;transition:.25s;font-size:15px;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff30 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.5s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.btn svg{width:20px;height:20px}
.btn.sec{background:#0b0916;border:1px solid var(--line);box-shadow:none;margin-top:12px;font-size:13px}
.btn.sec:after{display:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn[disabled]:after{display:none}
.stage{display:grid;place-items:center;background:#05040a;border:1px dashed var(--line);border-radius:16px;padding:14px;min-height:240px}
.frame{width:var(--w);max-width:100%;max-height:300px;aspect-ratio:var(--r);background:repeating-linear-gradient(45deg,#120f22,#120f22 10px,#0e0b1b 10px,#0e0b1b 20px);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:13px;padding:12px;transition:.4s;overflow:hidden}
.frame video{width:100%;height:100%;object-fit:contain;background:#000}
.frame svg{width:34px;height:34px;opacity:.6;margin-bottom:8px}
.prog{height:10px;background:#0b0916;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .5s ease;border-radius:99px}
.pinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:8px}
.note{font-size:13px;margin-top:12px;padding:11px 13px;border-radius:12px;background:#fbbf2412;border:1px solid #fbbf2440;color:#fde7a8;display:none}
.note.on{display:block;animation:up .4s}
pre{background:#05040a;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11.5px;overflow-x:auto;color:#c4b5fd;margin:10px 0 0;display:none}
pre.on{display:block}
.hist{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:#0b0916;border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;animation:up .4s both;text-align:left;color:var(--tx);font:inherit;width:100%}
.th{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#8b5cf633,#3b82f633);display:grid;place-items:center;flex:none;color:var(--mu)}
.item p{margin:0;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item small{color:var(--mu);font-size:11.5px}
.st{font-size:10px;padding:3px 8px;border-radius:99px;background:#fbbf2418;color:var(--wa);border:1px solid #fbbf2440;white-space:nowrap;margin-left:auto}
.st.ok{background:#34d39918;color:var(--ok);border-color:#34d39940}
.empty{text-align:center;color:var(--mu);font-size:13px;padding:18px 8px}
.lnk{background:none;border:0;color:var(--b);font:inherit;font-size:12px;cursor:pointer;padding:4px}
footer{text-align:center;color:var(--mu);font-size:11.5px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo"><i><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></i>AI VIDEO STUDIO</div>
 <div class="tag" id="status-tag" onclick="checkBackend()" title="Toque para testar conexão"><span class="dot"></span><span id="status-txt">Conectando...</span></div>
</header>

<section class="card">
 <h2>Prompt <small id="cnt">0 / 1000</small></h2>
 <textarea id="prompt" maxlength="1000" placeholder="Descreva o vídeo que você quer criar em inglês (ex: A futuristic car driving through a glowing cyberpunk city at night)..."></textarea>

 <h2 class="label">Formato</h2>
 <div class="row c3" id="g-format" role="radiogroup"></div>
 <h2 class="label">Duração</h2>
 <div class="row c3" id="g-dur" role="radiogroup"></div>
 <h2 class="label">Resolução</h2>
 <div class="row c3" id="g-res" role="radiogroup"></div>
</section>

<section class="card">
 <h2>Modelo de IA</h2>
 <div class="models" id="g-model" role="radiogroup"></div>
</section>

<button class="btn" id="gen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>GERAR VÍDEO</button>
<div style="height:14px"></div>

<section class="card">
 <h2>Visualização <small id="fmeta"></small></h2>
 <div class="stage"><div class="frame" id="frame"></div></div>
 <div class="prog"><i id="bar"></i></div>
 <div class="pinfo"><span id="pstate">Aguardando</span><span id="ppct">0%</span></div>
 <div class="note" id="note"></div>
 <a class="btn sec" id="dl" aria-disabled="true" style="text-decoration:none;pointer-events:none;opacity:.4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>BAIXAR VÍDEO</a>
 <button class="btn sec" id="tp" style="margin-top:8px">VER REQUISIÇÃO PREPARADA (JSON)</button>
 <pre id="json"></pre>
</section>

<section class="card">
 <h2>Histórico <button class="lnk" id="clr">Limpar</button></h2>
 <div class="hist" id="hist"></div>
</section>
<footer>v1.0 · Conectado ao Backend no Render</footer>
</div>

<script>
var CONFIG={
  backendUrl: "https://ai-video-studio-backend.onrender.com",
  submitPath: "/api/videos"
};

var provider={
 submit:function(job){
  if(!CONFIG.backendUrl) return Promise.reject(new Error("NO_BACKEND"));
  return fetch(CONFIG.backendUrl+CONFIG.submitPath,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(job)
  }).then(function(r){
    if(!r.ok) return r.json().then(function(err){ throw new Error(err.error || "Erro na geração"); });
    return r.json();
  });
 }
};

var OPT={
 format:[{v:"9:16",t:"Vertical",s:"9:16",w:18,h:32,r:"9/16",wd:"170px"},{v:"16:9",t:"Horizontal",s:"16:9",w:32,h:18,r:"16/9",wd:"100%"},{v:"1:1",t:"Quadrado",s:"1:1",w:24,h:24,r:"1/1",wd:"260px"}],
 dur:[{v:10,t:"10 s"},{v:15,t:"15 s"},{v:30,t:"30 s"}],
 res:[{v:"480p",t:"480p",s:"Rápido"},{v:"720p",t:"720p",s:"HD"},{v:"1080p",t:"1080p",s:"Full HD"}]
};
var MODELS=[
 {v:"text-to-video",t:"Texto para vídeo",d:"Gera vídeo realista a partir do prompt",i:"M4 6h16M4 12h10M4 18h14"}
];
var DIMS={"9:16":{"480p":[480,854],"720p":[720,1280],"1080p":[1080,1920]},"16:9":{"480p":[854,480],"720p":[1280,720],"1080p":[1920,1080]},"1:1":{"480p":[480,480],"720p":[720,720],"1080p":[1080,1080]}};
var S={format:"9:16",dur:10,res:"720p",model:"text-to-video"};
var hist=[];var $=function(i){return document.getElementById(i)};

function checkBackend(){
 $("status-txt").textContent="Conectando...";
 $("status-tag").classList.remove("on");
 fetch(CONFIG.backendUrl+"/api/health")
  .then(function(r){ return r.json(); })
  .then(function(d){
     var tag=$("status-tag");
     tag.classList.add("on");
     $("status-txt").textContent="Backend Conectado";
  })
  .catch(function(){
     fetch(CONFIG.backendUrl+"/")
      .then(function(r){ return r.json(); })
      .then(function(d){
         var tag=$("status-tag");
         tag.classList.add("on");
         $("status-txt").textContent="Backend Conectado";
      })
      .catch(function(){
         $("status-txt").textContent="Backend desconectado";
      });
  });
}

function build(id,list,key,fn){
 var el=$(id);el.innerHTML="";
 list.forEach(function(o){
  var b=document.createElement("button");b.type="button";b.setAttribute("role","radio");
  b.className=key==="model"?"model":"chip";b.innerHTML=fn(o);
  b.onclick=function(){S[key]=o.v;sync()};b.dataset.v=o.v;el.appendChild(b);
 });
}
build("g-format",OPT.format,"format",function(o){return '<span class="ar" style="width:'+o.w+'px;height:'+o.h+'px"></span>'+o.t+'<small>'+o.s+'</small>'});
build("g-dur",OPT.dur,"dur",function(o){return '<b style="font-size:18px">'+o.v+'</b><small>segundos</small>'});
build("g-res",OPT.res,"res",function(o){return o.t+'<small>'+o.s+'</small>'});
build("g-model",MODELS,"model",function(o){return '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+o.i+'"/></svg></span><div><b>'+o.t+'</b><span>'+o.d+'</span></div><em class="badge" style="font-style:normal;color:var(--ok);border-color:var(--ok)">Ativo</em>'});

function sync(){
 [["g-format","format"],["g-dur","dur"],["g-res","res"],["g-model","model"]].forEach(function(p){
  Array.prototype.forEach.call($(p[0]).children,function(c){c.setAttribute("aria-checked",String(c.dataset.v)===String(S[p[1]]))});
 });
 var f=OPT.format.filter(function(x){return x.v===S.format})[0];
 var fr=$("frame");fr.style.setProperty("--r",f.r);fr.style.setProperty("--w",f.wd);
 var d=DIMS[S.format][S.res];$("fmeta").textContent=S.format+" · "+d[0]+"×"+d[1]+" · "+S.dur+"s";
}
function emptyFrame(){
 $("frame").innerHTML='<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg><div>Nenhum vídeo gerado ainda</div><small>Insira um prompt e clique em Gerar Vídeo.</small></div>';
}
function setProgress(p,t){$("bar").style.width=p+"%";$("ppct").textContent=p+"%";$("pstate").textContent=t}
function setNote(t){var n=$("note");n.textContent=t;n.classList.toggle("on",!!t)}

function setVideo(url,name){
 $("frame").innerHTML="";var v=document.createElement("video");v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;$("frame").appendChild(v);
 var a=$("dl");a.href=url;a.download=name||"ai-video-studio.mp4";a.style.pointerEvents="auto";a.style.opacity="1";a.setAttribute("aria-disabled","false");
}

function job(){var d=DIMS[S.format][S.res];return{prompt:$("prompt").value.trim(),model:S.model,aspectRatio:S.format,durationSeconds:S.dur,resolution:S.res,width:d[0],height:d[1]}}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&","<":"<",">":">"}[c]})}

function renderHist(){
 var h=$("hist");
 if(!hist.length){h.innerHTML='<div class="empty">Suas gerações aparecerão aqui.</div>';return}
 h.innerHTML="";
 hist.forEach(function(j,i){
  var b=document.createElement("button");b.className="item";b.style.animationDelay=(i*40)+"ms";
  var stClass = j.videoUrl ? 'st ok' : 'st';
  var stText = j.videoUrl ? 'Concluído' : 'Falhou';
  b.innerHTML='<span class="th"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg></span><div style="min-width:0"><p>'+esc(j.prompt)+'</p><small>'+j.aspectRatio+' · '+j.durationSeconds+'s · '+j.resolution+' · '+j.at+'</small></div><span class="'+stClass+'">'+stText+'</span>';
  b.onclick=function(){
    $("prompt").value=j.prompt;S.format=j.aspectRatio;S.dur=j.durationSeconds;S.res=j.resolution;S.model=j.model;cnt();sync();
    if(j.videoUrl) setVideo(j.videoUrl);
    window.scrollTo({top:0,behavior:"smooth"});
  };
  h.appendChild(b);
 });
}
function save(){try{localStorage.setItem("aivs_hist",JSON.stringify(hist))}catch(e){}}
function cnt(){$("cnt").textContent=$("prompt").value.length+" / 1000"}

$("prompt").addEventListener("input",cnt);
$("tp").onclick=function(){var p=$("json");p.textContent=JSON.stringify(job(),null,2);p.classList.toggle("on")};
$("clr").onclick=function(){hist=[];save();renderHist()};
$("gen").onclick=function(){
 var j=job();
 if(j.prompt.length<10){setNote("Escreva um prompt com pelo menos 10 caracteres.");$("prompt").focus();return}
 setNote("");setProgress(20,"Enviando para a IA (pode levar de 30s a 2min)...");
 $("gen").disabled = true;

 provider.submit(j).then(function(r){
  setProgress(100,"Vídeo gerado com sucesso!");
  setVideo(r.videoUrl);
  j.videoUrl = r.videoUrl;
  j.at=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  hist.unshift(j);hist=hist.slice(0,20);save();renderHist();
  $("gen").disabled = false;
 }).catch(function(e){
  setProgress(0,"Falha na geração");
  setNote("Erro: " + e.message);
  j.at=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  hist.unshift(j);hist=hist.slice(0,20);save();renderHist();
  $("gen").disabled = false;
 });
};

try{hist=JSON.parse(localStorage.getItem("aivs_hist")||"[]")||[]}catch(e){hist=[]}
emptyFrame();sync();renderHist();setProgress(0,"Aguardando");checkBackend();
</script>
</body>
</html>
